<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Profil — Absensi Siswa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div class="siswa-shell">
    <div class="siswa-header" style="border-radius:0 0 20px 20px; padding:20px;">
      <img class="siswa-logo" src="/assets/img/logo-pkbm.png" alt="Logo PKBM Nurul Islam">
      <div class="name" style="margin:0;">Profil Saya</div>
    </div>
    <div class="siswa-body">
      <div class="card" id="profil-card">Memuat...</div>
      <div class="card" id="persentase-card">
        <p style="font-weight:700; color:var(--ink); margin-bottom:6px;">Kehadiran Semester Ini</p>
        <p id="persentase-periode" style="font-size:0.82rem; margin-bottom:10px;"></p>
        <div style="display:flex; align-items:center; gap:18px; flex-wrap:wrap;">
          <div style="text-align:center;">
            <div style="font-size:2rem; font-weight:800; color:var(--primary);" id="persentase-angka">-</div>
            <div style="font-size:0.78rem; color:var(--ink-muted);">Persentase</div>
          </div>
          <div style="font-size:0.85rem; color:var(--ink-muted); flex:1; min-width:180px;">
            Hadir <b id="p-hadir">-</b> · Terlambat <b id="p-terlambat">-</b> · Izin <b id="p-izin">-</b> · Sakit <b id="p-sakit">-</b> · Alpa <b id="p-alpa">-</b>
            <br>dari <b id="p-total">-</b> hari efektif sekolah.
          </div>
        </div>
        <a href="/siswa/riwayat.html" class="btn btn-outline btn-block" style="margin-top:14px;">Lihat Riwayat Lengkap</a>
      </div>
      <button class="btn btn-outline btn-block" onclick="window.location.href='/siswa/ganti-password.html'">Ganti Password</button>
      <div style="height:10px;"></div>
      <button class="btn btn-danger btn-block" onclick="logoutSiswa()">Keluar</button>
    </div>
  </div>
  <nav class="bottom-nav">
    <a href="/siswa/dashboard.html"><span class="icon">🏠</span>Beranda</a>
    <a href="/siswa/riwayat.html"><span class="icon">📅</span>Riwayat</a>
    <a href="/siswa/laporan.html"><span class="icon">📄</span>Laporan</a>
    <a href="/siswa/profil.html" class="active"><span class="icon">👤</span>Profil</a>
  </nav>
  <script src="/assets/js/api.js"></script>
  <script>
    requireSiswaAuth();
    (async () => {
      try {
        const data = await apiCall('/siswa-me', { isSiswa: true });
        const s = data.student;
        document.getElementById('profil-card').innerHTML = `
          <p style="color:var(--ink); font-weight:700; font-size:1.1rem; margin-bottom:12px;">${s.nama}</p>
          <table style="width:100%; font-size:0.9rem;">
            <tr><td style="color:var(--ink-muted); padding:4px 0;">NISN</td><td style="text-align:right; font-weight:600;">${s.nisn || '-'}</td></tr>
            <tr><td style="color:var(--ink-muted); padding:4px 0;">Jenjang</td><td style="text-align:right; font-weight:600;">${s.jenjang}</td></tr>
            <tr><td style="color:var(--ink-muted); padding:4px 0;">Program</td><td style="text-align:right; font-weight:600;">${s.program.replace('_',' ')}</td></tr>
            <tr><td style="color:var(--ink-muted); padding:4px 0;">Kelas</td><td style="text-align:right; font-weight:600;">${s.kelas}</td></tr>
            <tr><td style="color:var(--ink-muted); padding:4px 0;">Jenis Kelamin</td><td style="text-align:right; font-weight:600;">${s.jk === 'L' ? 'Laki-laki' : 'Perempuan'}</td></tr>
            <tr><td style="color:var(--ink-muted); padding:4px 0;">No. HP</td><td style="text-align:right; font-weight:600;">${s.hp || '-'}</td></tr>
            <tr><td style="color:var(--ink-muted); padding:4px 0;">Status</td><td style="text-align:right; font-weight:600;">${s.status}</td></tr>
          </table>
        `;
      } catch (err) {
        if (err.status === 401) { logoutSiswa(); return; }
        document.getElementById('profil-card').textContent = 'Gagal memuat profil.';
      }

      try {
        const now = new Date();
        const tahun = now.getMonth() >= 6 ? now.getFullYear() : now.getFullYear() - 1;
        const semester = now.getMonth() >= 6 ? 'ganjil' : 'genap';
        const rekap = await apiCall(`/siswa-riwayat?mode=semester&tahun=${tahun}&semester=${semester}`, { isSiswa: true });
        document.getElementById('persentase-periode').textContent = rekap.periode;
        document.getElementById('persentase-angka').textContent = `${rekap.statistik.persentase_kehadiran}%`;
        document.getElementById('p-hadir').textContent = rekap.statistik.hadir;
        document.getElementById('p-terlambat').textContent = rekap.statistik.terlambat;
        document.getElementById('p-izin').textContent = rekap.statistik.izin;
        document.getElementById('p-sakit').textContent = rekap.statistik.sakit;
        document.getElementById('p-alpa').textContent = rekap.statistik.alpa;
        document.getElementById('p-total').textContent = rekap.statistik.total_hari_efektif;
      } catch (err) {
        if (err.status === 401) { logoutSiswa(); return; }
        document.getElementById('persentase-card').innerHTML = '<p>Gagal memuat rekap kehadiran.</p>';
      }
    })();
  </script>
</body>
</html>
