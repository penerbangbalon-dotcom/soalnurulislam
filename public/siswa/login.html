<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Login Siswa — Absensi PKBM Nurul Islam</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; }
  .wrap { max-width: 400px; width: 100%; }
  .back { display: inline-block; margin-bottom: 14px; font-size: 0.85rem; color: var(--ink-muted); text-decoration: none; }
  .logo-badge { width: 72px; height: 72px; margin: 0 auto 14px; }
  .logo-badge img { width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
  <div class="wrap">
    <a href="/" class="back">&larr; Kembali</a>
    <div class="logo-badge"><img src="/assets/img/logo-pkbm.png" alt="Logo PKBM Nurul Islam"></div>
    <h1>Login Siswa</h1>
    <p>Masukkan NISN dan password Anda.</p>
    <div class="card">
      <form id="form-login">
        <div class="field">
          <label for="nisn">NISN</label>
          <input type="text" id="nisn" inputmode="numeric" placeholder="Contoh: 0075030298" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Password / tanggal lahir (DDMMYYYY)" required>
          <p class="hint">Login pertama kali? Password awal Anda adalah tanggal lahir format DDMMYYYY (contoh: 08122007).</p>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btn-submit">Masuk</button>
      </form>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script>
    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      btn.disabled = true; btn.textContent = 'Memproses...';
      try {
        const nisn = document.getElementById('nisn').value.trim();
        const password = document.getElementById('password').value;
        const data = await apiCall('/auth-login-siswa', { method: 'POST', body: { nisn, password } });
        localStorage.setItem('siswa_token', data.token);
        window.location.href = data.must_change_password ? '/siswa/ganti-password.html' : '/siswa/dashboard.html';
      } catch (err) {
        toast(err.message, 'error');
      } finally {
        btn.disabled = false; btn.textContent = 'Masuk';
      }
    });
  </script>
</body>
</html>
