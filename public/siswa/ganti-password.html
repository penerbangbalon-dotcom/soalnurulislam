<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Ganti Password — Absensi Siswa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<style>body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:16px; } .wrap{max-width:400px;width:100%;}</style>
</head>
<body>
  <div class="wrap">
    <h1>Buat Password Baru</h1>
    <p>Demi keamanan akun Anda, buat password baru yang hanya Anda ketahui (minimal 6 karakter).</p>
    <div class="card">
      <form id="form-ganti">
        <div class="field">
          <label for="p1">Password Baru</label>
          <input type="password" id="p1" minlength="6" required>
        </div>
        <div class="field">
          <label for="p2">Ulangi Password Baru</label>
          <input type="password" id="p2" minlength="6" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btn-submit">Simpan &amp; Lanjutkan</button>
      </form>
    </div>
  </div>
  <script src="/assets/js/api.js"></script>
  <script>
    requireSiswaAuth();
    document.getElementById('form-ganti').addEventListener('submit', async (e) => {
      e.preventDefault();
      const p1 = document.getElementById('p1').value;
      const p2 = document.getElementById('p2').value;
      if (p1 !== p2) { toast('Password tidak sama.', 'error'); return; }
      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      try {
        await apiCall('/siswa-ganti-password', { method: 'POST', body: { password_baru: p1 }, isSiswa: true });
        toast('Password berhasil diubah.', 'success');
        window.location.href = '/siswa/dashboard.html';
      } catch (err) {
        toast(err.message, 'error');
      } finally { btn.disabled = false; }
    });
  </script>
</body>
</html>
