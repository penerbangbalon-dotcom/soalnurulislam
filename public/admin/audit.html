<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit Log — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/admin-shell.js"></script>
<script>
const slot = renderAdminShell('/admin/audit.html', 'Audit Log');
slot.innerHTML = `
  <div class="card">
    <div style="display:flex; gap:10px; margin-bottom:12px;">
      <button class="btn btn-outline btn-sm" data-tab="audit_logs">Aktivitas</button>
      <button class="btn btn-outline btn-sm" data-tab="security">Keamanan (Anti-Kecurangan)</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Waktu</th><th>Pelaku</th><th>Aksi / Kejadian</th><th>Detail</th></tr></thead>
        <tbody id="tbody-log"><tr><td colspan="4">Memuat...</td></tr></tbody>
      </table>
    </div>
    <div style="display:flex; justify-content:center; gap:8px; margin-top:14px;" id="pagination"></div>
  </div>
`;

let tab = 'audit_logs';
let page = 1;

async function muat() {
  try {
    const type = tab === 'security' ? 'security' : 'audit';
    const data = await apiCall(`/admin-audit-log?type=${type}&page=${page}&per_page=30`);
    const tbody = document.getElementById('tbody-log');
    if (!data.data.length) { tbody.innerHTML = '<tr><td colspan="4">Belum ada catatan.</td></tr>'; }
    else if (tab === 'security') {
      tbody.innerHTML = data.data.map((r) => `
        <tr><td>${new Date(r.created_at).toLocaleString('id-ID', {timeZone:'Asia/Jakarta'})}</td>
        <td>${r.student_id || '-'}</td><td>${r.event_type}</td><td><code style="font-size:0.75rem;">${JSON.stringify(r.detail)}</code></td></tr>
      `).join('');
    } else {
      tbody.innerHTML = data.data.map((r) => `
        <tr><td>${new Date(r.created_at).toLocaleString('id-ID', {timeZone:'Asia/Jakarta'})}</td>
        <td>${r.actor_label || r.actor_type}</td><td>${r.action}</td><td><code style="font-size:0.75rem;">${JSON.stringify(r.detail||{})}</code></td></tr>
      `).join('');
    }
    const totalPages = Math.max(1, Math.ceil(data.total / 30));
    document.getElementById('pagination').innerHTML = Array.from({length: Math.min(totalPages,10)}, (_,i) => i+1)
      .map((p) => `<button class="btn btn-sm ${p===page?'btn-primary':'btn-outline'}" data-page="${p}">${p}</button>`).join('');
    document.querySelectorAll('[data-page]').forEach((b) => b.onclick = () => { page = Number(b.dataset.page); muat(); });
  } catch (err) { if (err.status === 401) { logoutAdmin(); return; } toast(err.message, 'error'); }
}

document.querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => { tab = b.dataset.tab; page = 1; muat(); });
muat();
</script>
</body>
</html>
