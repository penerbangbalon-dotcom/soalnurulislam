<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Absensi Digital — PKBM Nurul Islam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .picker { max-width: 420px; width: 100%; padding: 20px; text-align: center; }
  .logo-badge { width: 64px; height: 64px; margin: 0 auto 16px; }
  .logo-badge img { width: 100%; height: 100%; object-fit: contain; }
  .choice { display: block; text-align: left; margin-top: 12px; }
  .choice .sub { font-size: 0.82rem; }
</style>
</head>
<body>
  <div class="picker">
    <div class="logo-badge"><img src="/assets/img/logo-pkbm.png" alt="Logo PKBM Nurul Islam"></div>
    <h1>Absensi Digital</h1>
    <p>PKBM Nurul Islam — Paket B &amp; Paket C</p>
    <div class="card choice">
      <a href="/siswa/login.html" class="btn btn-primary btn-block">Masuk sebagai Siswa</a>
      <p class="sub">Login menggunakan NISN untuk absen datang &amp; pulang</p>
    </div>
    <div class="card choice">
      <a href="/admin/login.html" class="btn btn-outline btn-block">Masuk sebagai Admin</a>
      <p class="sub">Kelola data siswa, sesi absensi, dan laporan</p>
    </div>
  </div>
</body>
</html>
